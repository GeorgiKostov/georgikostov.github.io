title: "Georgi Kostov"
tagline: "Unity Developer, XR Specialist & Educator"
description: "Senior Unity developer, XR specialist, educator, and technical writer building games, simulations, digital twins, and AI-powered products."
lang: en
locale: en_US
timezone: Europe/Vienna
author:
  name: "Georgi Kostov"
  url: "https://kostovsolutions.com/"
  twitter: KostovSolutions
theme: jekyll-theme-cayman

# Base URL for GitHub Pages
baseurl: "" # Leave this empty if you’re not using a subdirectory
url: "https://kostovsolutions.com"

# Identity and social profiles used by jekyll-seo-tag.
twitter:
  username: KostovSolutions
  card: summary_large_image
social:
  name: "Georgi Kostov"
  links:
    - "https://www.linkedin.com/in/kostovg/"
    - "https://x.com/KostovSolutions"
    - "https://www.researchgate.net/profile/Georgi-Kostov"

# Give every rendered page a crawlable social preview unless it defines a
# more specific image in front matter.
defaults:
  - scope:
      path: ""
    values:
      image: "/assets/images/social/georgi-kostov-social.png"

# Navigation Links
links:
  Home: "/"
  Projects: "/pages/projects/"
  Blog: "/pages/blog/"
  Publications: "/pages/publications/"

# Blog Configuration
collections:
  posts:
    output: true
    permalink: /blog/:title/  # Clean URLs for blog posts

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag       # Adds SEO metadata
  - jekyll-feed          # Generates RSS feed for the blog
  - jekyll-sitemap       # Creates a sitemap for search engines
  - jekyll-paginate      # Enables pagination for blog posts


# Markdown Configuration
markdown: kramdown
kramdown:
  input: GFM # GitHub Flavored Markdown


# Exclude Unnecessary Files and Directories
exclude:
  - index.html
  - another-page.md
  - docs
  - script
  - jekyll-theme-cayman.gemspec
  - LICENSE
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
