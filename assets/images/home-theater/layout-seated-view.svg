<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Seated view of the front wall</title>
  <desc id="desc">The 3.35 metre wide and 2.5 metre high front wall as seen from the sofa, with a 120-inch image, left and right speakers at the room edges, a center speaker, subwoofer, and height speakers just below the ceiling.</desc>
  <defs>
    <style>
      .wall{fill:#fff;stroke:#171717;stroke-width:5}.screen{fill:#f6f6f6;stroke:#171717;stroke-width:5}.object{fill:#fff;stroke:#171717;stroke-width:3}.soft{fill:#eee;stroke:#171717;stroke-width:2.5}.dim{fill:none;stroke:#171717;stroke-width:1.8}.guide{fill:none;stroke:#777;stroke-width:1.8;stroke-dasharray:7 6}.label{font:600 18px Arial,sans-serif;fill:#171717}.small{font:15px Arial,sans-serif;fill:#444}.tiny{font:13px Arial,sans-serif;fill:#555}.center{text-anchor:middle}.end{text-anchor:end}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#171717"/></marker>
  </defs>

  <rect width="1000" height="720" fill="#fff"/>
  <text x="500" y="42" class="label center">View from the main seat</text>
  <text x="500" y="67" class="small center">Front speakers use the full room width; Atmos stays tight to the ceiling</text>

  <rect x="165" y="110" width="670" height="500" class="wall"/>
  <rect x="234" y="165" width="532" height="298" rx="2" class="screen"/>

  <!-- Front height speakers -->
  <g aria-label="front height speakers">
    <rect x="180" y="126" width="56" height="62" rx="5" class="object" transform="rotate(-7 208 157)"/>
    <circle cx="208" cy="157" r="12" class="soft"/>
    <rect x="764" y="126" width="56" height="62" rx="5" class="object" transform="rotate(7 792 157)"/>
    <circle cx="792" cy="157" r="12" class="soft"/>
  </g>

  <!-- Left/right, center, and subwoofer -->
  <g aria-label="front speakers and subwoofer">
    <rect x="178" y="344" width="58" height="238" rx="5" class="object"/>
    <circle cx="207" cy="405" r="14" class="soft"/><circle cx="207" cy="468" r="22" class="soft"/>
    <rect x="764" y="344" width="58" height="238" rx="5" class="object"/>
    <circle cx="793" cy="405" r="14" class="soft"/><circle cx="793" cy="468" r="22" class="soft"/>
    <rect x="430" y="505" width="140" height="54" rx="5" class="object"/>
    <circle cx="470" cy="532" r="12" class="soft"/><circle cx="530" cy="532" r="12" class="soft"/>
    <rect x="654" y="491" width="92" height="92" rx="5" class="soft"/><circle cx="700" cy="537" r="26" class="object"/>
  </g>

  <line x1="234" y1="485" x2="766" y2="485" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="500" y="480" class="small center">120 inches · approx. 2.66 × 1.49 m at 16:9</text>

  <line x1="207" y1="325" x2="793" y2="325" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="500" y="315" class="small center">≈2.9 m L/R centre spacing</text>

  <!-- Room dimensions -->
  <line x1="165" y1="650" x2="835" y2="650" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="165" y1="620" x2="165" y2="668" class="dim"/><line x1="835" y1="620" x2="835" y2="668" class="dim"/>
  <text x="500" y="683" class="label center">3.35 m room width</text>

  <line x1="130" y1="110" x2="130" y2="610" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="144" y1="110" x2="117" y2="110" class="dim"/><line x1="144" y1="610" x2="117" y2="610" class="dim"/>
  <text x="100" y="360" class="label center" transform="rotate(-90 100 360)">2.5 m ceiling</text>

  <text x="190" y="600" class="tiny">L/R at room edges</text>
  <line x1="228" y1="592" x2="228" y2="565" class="guide"/>
</svg>
