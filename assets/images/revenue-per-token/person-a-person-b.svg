<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Token Maxxer and Token Master allocate the same AI token budget differently</title>
  <desc id="desc">The Token Maxxer disperses tokens across reports, features, rewrites, and products, producing lots of output but little value. The Token Master filters markets through evidence and commitment before focusing tokens on one valuable business.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfa"/>
      <stop offset="1" stop-color="#eaf4f2"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#157878"/>
      <stop offset="1" stop-color="#0f5f6b"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d85b70"/>
      <stop offset="1" stop-color="#bb3f5b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#143939" flood-opacity=".12"/>
    </filter>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c65368"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#157878"/>
    </marker>
    <style>
      .t { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #233332; }
      .eyebrow { font-size: 21px; font-weight: 760; letter-spacing: 2.3px; }
      .head { font-size: 39px; font-weight: 780; }
      .sub { font-size: 22px; fill: #607370; }
      .label { font-size: 21px; font-weight: 680; }
      .small { font-size: 18px; fill: #687a78; }
      .white { fill: #fff; }
      .card { fill: #fff; stroke: #cddfdd; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="800" y="64" text-anchor="middle" class="t eyebrow" fill="#157878">SAME MODELS · SAME TOKEN BUDGET · DIFFERENT ALLOCATION</text>

  <line x1="800" y1="98" x2="800" y2="832" stroke="#c9dad7" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="64" y="105" width="690" height="706" rx="30" class="card"/>
    <rect x="846" y="105" width="690" height="706" rx="30" class="card"/>
  </g>

  <circle cx="142" cy="181" r="38" fill="url(#rose)"/>
  <text x="142" y="194" text-anchor="middle" class="t head white" style="font-size:34px">X</text>
  <text x="205" y="177" class="t head">Token Maxxer</text>
  <text x="205" y="210" class="t sub">Produces everywhere</text>

  <rect x="108" y="260" width="142" height="62" rx="31" fill="#fff0f3" stroke="#e7a8b4" stroke-width="2"/>
  <text x="179" y="298" text-anchor="middle" class="t label" fill="#bb3f5b">TOKENS</text>

  <path d="M250 291 C330 291 330 286 395 286" fill="none" stroke="#c65368" stroke-width="4" marker-end="url(#arrowA)"/>
  <path d="M250 291 C330 291 330 382 395 382" fill="none" stroke="#c65368" stroke-width="4" marker-end="url(#arrowA)"/>
  <path d="M250 291 C330 291 330 478 395 478" fill="none" stroke="#c65368" stroke-width="4" marker-end="url(#arrowA)"/>
  <path d="M250 291 C330 291 330 574 395 574" fill="none" stroke="#c65368" stroke-width="4" marker-end="url(#arrowA)"/>

  <g class="t label">
    <rect x="406" y="250" width="285" height="72" rx="16" fill="#fff5f7" stroke="#efc6cf" stroke-width="2"/>
    <text x="548" y="293" text-anchor="middle">Market reports</text>
    <rect x="406" y="346" width="285" height="72" rx="16" fill="#fff5f7" stroke="#efc6cf" stroke-width="2"/>
    <text x="548" y="389" text-anchor="middle">Feature backlog</text>
    <rect x="406" y="442" width="285" height="72" rx="16" fill="#fff5f7" stroke="#efc6cf" stroke-width="2"/>
    <text x="548" y="485" text-anchor="middle">Architecture rewrite</text>
    <rect x="406" y="538" width="285" height="72" rx="16" fill="#fff5f7" stroke="#efc6cf" stroke-width="2"/>
    <text x="548" y="581" text-anchor="middle">Three new products</text>
  </g>

  <rect x="108" y="667" width="583" height="95" rx="20" fill="#fff0f3"/>
  <text x="142" y="707" class="t eyebrow" fill="#bb3f5b">RESULT</text>
  <text x="142" y="741" class="t label">Lots of motion · little evidence · little value</text>

  <circle cx="924" cy="181" r="38" fill="url(#teal)"/>
  <text x="924" y="194" text-anchor="middle" class="t head white" style="font-size:34px">M</text>
  <text x="987" y="177" class="t head">Token Master</text>
  <text x="987" y="210" class="t sub">Filters, then focuses</text>

  <rect x="892" y="260" width="142" height="62" rx="31" fill="#e9f5f3" stroke="#9bc9c1" stroke-width="2"/>
  <text x="963" y="298" text-anchor="middle" class="t label" fill="#157878">50 MARKETS</text>

  <path d="M1034 291H1097" fill="none" stroke="#157878" stroke-width="4" marker-end="url(#arrowB)"/>
  <polygon points="1110,250 1288,250 1244,332 1154,332" fill="#e9f5f3" stroke="#a9cec8" stroke-width="2"/>
  <text x="1199" y="286" text-anchor="middle" class="t label">Public signals</text>
  <text x="1199" y="314" text-anchor="middle" class="t small">5 survive</text>

  <path d="M1199 332V374" fill="none" stroke="#157878" stroke-width="4" marker-end="url(#arrowB)"/>
  <polygon points="1134,386 1264,386 1237,466 1161,466" fill="#def0ed" stroke="#8dbfb7" stroke-width="2"/>
  <text x="1199" y="420" text-anchor="middle" class="t label">Interviews</text>
  <text x="1199" y="448" text-anchor="middle" class="t small">3 survive</text>

  <path d="M1199 466V508" fill="none" stroke="#157878" stroke-width="4" marker-end="url(#arrowB)"/>
  <polygon points="1154,520 1244,520 1227,598 1171,598" fill="#d0e9e5" stroke="#76afa6" stroke-width="2"/>
  <text x="1199" y="553" text-anchor="middle" class="t label">Offers</text>
  <text x="1199" y="581" text-anchor="middle" class="t small">1 earns focus</text>

  <path d="M1199 598V642" fill="none" stroke="#157878" stroke-width="5" marker-end="url(#arrowB)"/>
  <rect x="1019" y="656" width="360" height="106" rx="22" fill="url(#teal)"/>
  <text x="1199" y="699" text-anchor="middle" class="t eyebrow white">RESULT</text>
  <text x="1199" y="738" text-anchor="middle" class="t head white" style="font-size:28px">One valuable business</text>

  <text x="800" y="862" text-anchor="middle" class="t label" fill="#516563">The Token Master's advantage is not fewer tokens. It is a higher bar for earning the next ones.</text>
</svg>
