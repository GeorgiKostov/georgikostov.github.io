<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Okolo event processing pipeline</title>
  <desc id="desc">A diagram showing public event sources flowing through polite crawling, structured extraction or an LLM fallback, validation, geocoding, deduplication, Postgres storage, and the live map.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfa"/>
      <stop offset="1" stop-color="#eef7f6"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#157878"/>
      <stop offset="1" stop-color="#176b7d"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d44565"/>
      <stop offset="1" stop-color="#bd3153"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#143939" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5d7b79"/>
    </marker>
    <style>
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #233332; }
      .eyebrow { font-size: 22px; font-weight: 750; letter-spacing: 2.2px; text-transform: uppercase; fill: #157878; }
      .heading { font-size: 34px; font-weight: 760; }
      .body { font-size: 22px; fill: #516563; }
      .small { font-size: 19px; fill: #617472; }
      .white { fill: #fff; }
      .card { fill: #fff; stroke: #cfe1de; stroke-width: 2; }
      .line { fill: none; stroke: #5d7b79; stroke-width: 5; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #9cb5b2; stroke-width: 4; stroke-dasharray: 9 11; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="920" rx="36" fill="url(#background)"/>
  <text x="74" y="78" class="label eyebrow">FROM ANNOUNCEMENT TO MAP PIN</text>
  <text x="74" y="126" class="label heading">One pipeline, many website formats</text>

  <!-- Sources -->
  <g filter="url(#shadow)">
    <rect x="70" y="190" width="300" height="600" rx="28" class="card"/>
  </g>
  <circle cx="132" cy="255" r="30" fill="#e7f3f1"/>
  <path d="M116 253h32M120 242h24M120 264h24M125 231h14" stroke="#157878" stroke-width="5" stroke-linecap="round"/>
  <text x="178" y="250" class="label heading" font-size="30">Sources</text>
  <text x="178" y="281" class="label small">Public, local, fragmented</text>

  <g class="label body">
    <rect x="106" y="330" width="228" height="62" rx="14" fill="#f4f8f7"/>
    <text x="134" y="369">Municipal HTML</text>
    <rect x="106" y="410" width="228" height="62" rx="14" fill="#f4f8f7"/>
    <text x="134" y="449">JSON-LD / Microdata</text>
    <rect x="106" y="490" width="228" height="62" rx="14" fill="#f4f8f7"/>
    <text x="134" y="529">iCal / RSS / APIs</text>
    <rect x="106" y="570" width="228" height="62" rx="14" fill="#f4f8f7"/>
    <text x="134" y="609">CMS templates</text>
    <rect x="106" y="650" width="228" height="62" rx="14" fill="#f4f8f7"/>
    <text x="134" y="689">Posters &amp; flyers</text>
  </g>
  <text x="106" y="752" class="label small">Every record keeps a</text>
  <text x="106" y="778" class="label small" font-weight="700">link to its source.</text>

  <!-- Fetch -->
  <path d="M370 490 H455" class="line"/>
  <g filter="url(#shadow)">
    <rect x="455" y="300" width="270" height="380" rx="28" class="card"/>
  </g>
  <circle cx="515" cy="365" r="30" fill="#e7f3f1"/>
  <path d="M500 370c4 9 25 9 29 0M503 355h23M515 345v30" stroke="#157878" stroke-width="5" stroke-linecap="round" fill="none"/>
  <text x="562" y="358" class="label heading" font-size="30">Fetch</text>
  <text x="562" y="389" class="label small">Be gentle by default</text>
  <g class="label body">
    <text x="495" y="454">robots.txt</text>
    <text x="495" y="499">Identifying user agent</text>
    <text x="495" y="544">Per-host delay</text>
    <text x="495" y="589">ETag / Last-Modified</text>
    <text x="495" y="634">Page-content hash</text>
  </g>

  <!-- Extract -->
  <path d="M725 490 H795" class="line"/>
  <g filter="url(#shadow)">
    <rect x="795" y="190" width="355" height="600" rx="28" class="card"/>
  </g>
  <text x="835" y="245" class="label eyebrow">EXTRACT</text>
  <text x="835" y="286" class="label heading" font-size="27">Cheapest reliable</text>
  <text x="835" y="317" class="label heading" font-size="27">route wins</text>

  <rect x="835" y="345" width="275" height="220" rx="20" fill="#eaf5f3" stroke="#b7d6d1" stroke-width="2"/>
  <text x="870" y="390" class="label heading" font-size="27">Structured first</text>
  <text x="870" y="428" class="label body">1. JSON-LD / Microdata</text>
  <text x="870" y="466" class="label body">2. iCal / RSS / API</text>
  <text x="870" y="504" class="label body">3. CMS adapter</text>
  <rect x="870" y="525" width="140" height="28" rx="14" fill="#157878"/>
  <text x="892" y="546" class="label white small" font-weight="700">$0 LLM cost</text>

  <path d="M972 565 V610" class="dash"/>
  <rect x="835" y="615" width="275" height="122" rx="20" fill="#fff3f5" stroke="#efc8d1" stroke-width="2"/>
  <text x="870" y="660" class="label heading" font-size="27">LLM fallback</text>
  <text x="870" y="697" class="label body">Strict JSON schema</text>
  <text x="870" y="724" class="label small">Unknown means null.</text>

  <!-- Process + serve -->
  <path d="M1150 490 H1190" class="line"/>
  <g filter="url(#shadow)">
    <rect x="1190" y="190" width="340" height="600" rx="28" fill="url(#teal)"/>
  </g>
  <text x="1230" y="245" class="label white eyebrow">PLACE &amp; SERVE</text>

  <g>
    <circle cx="1250" cy="315" r="25" fill="#fff" opacity=".16"/>
    <path d="M1238 315l8 8 16-18" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="1292" y="308" class="label white" font-size="26" font-weight="750">Validate</text>
    <text x="1292" y="337" class="label white" font-size="17" opacity=".85">date · fields · region</text>

    <circle cx="1250" cy="413" r="25" fill="#fff" opacity=".16"/>
    <path d="M1250 395c-10 0-18 8-18 18 0 14 18 31 18 31s18-17 18-31c0-10-8-18-18-18zm0 12a7 7 0 110 14 7 7 0 010-14z" fill="#fff"/>
    <text x="1292" y="406" class="label white" font-size="26" font-weight="750">Geocode</text>
    <text x="1292" y="435" class="label white" font-size="17" opacity=".85">venue → address → town</text>

    <circle cx="1250" cy="511" r="25" fill="#fff" opacity=".16"/>
    <path d="M1238 503h19v19h-19zM1244 497h19v19" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <text x="1292" y="504" class="label white" font-size="26" font-weight="750">Deduplicate</text>
    <text x="1292" y="533" class="label white" font-size="17" opacity=".85">exact + cautious fuzzy match</text>

    <circle cx="1250" cy="609" r="25" fill="#fff" opacity=".16"/>
    <ellipse cx="1250" cy="600" rx="15" ry="7" fill="none" stroke="#fff" stroke-width="4"/>
    <path d="M1235 600v19c0 4 7 7 15 7s15-3 15-7v-19M1235 610c0 4 7 7 15 7s15-3 15-7" fill="none" stroke="#fff" stroke-width="4"/>
    <text x="1292" y="602" class="label white" font-size="26" font-weight="750">Store</text>
    <text x="1292" y="631" class="label white" font-size="17" opacity=".85">Supabase Postgres + PostGIS</text>

    <circle cx="1250" cy="707" r="25" fill="#fff" opacity=".16"/>
    <path d="M1235 718l10-15 8 7 13-20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1292" y="700" class="label white" font-size="26" font-weight="750">Render</text>
    <text x="1292" y="729" class="label white" font-size="17" opacity=".85">Next.js · MapLibre · OSM</text>
  </g>

  <!-- Footer note -->
  <rect x="455" y="825" width="1075" height="50" rx="25" fill="#dfecea"/>
  <text x="992" y="858" text-anchor="middle" class="label body" font-weight="650">Structured data handles the common case. The LLM handles the irregular tail.</text>
</svg>
